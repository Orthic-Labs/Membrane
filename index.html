<!doctype html><meta charset="utf-8"><title>Membrane Hub</title><style>body{font:14px system-ui;margin:0;padding:18px;background:#15171a;color:#eee}main{min-width:280px}h1{font-size:18px;margin:0 0 12px}.state{padding:10px;border-radius:8px;background:#24282d}.muted{color:#a9b0b8}</style><main aria-live="polite"><h1>Membrane Hub</h1><section class="state" id="state" tabindex="0">Offline — no snapshot cached</section><p class="muted" id="observed">Waiting for read-only Hub snapshot</p><label><input id="startup" type="checkbox"> Launch at login</label></main><script type="module">
const state=document.querySelector('#state'), observed=document.querySelector('#observed'), startup=document.querySelector('#startup');
const render=s=>{const sections=Object.entries(s?.payload||{}).filter(([,v])=>v&&typeof v==='object'&&typeof v.state==='string'); const states=sections.map(([,v])=>v.state); const summary=states.includes('unavailable')?'Unavailable':states.includes('degraded')?'Degraded':states.length?'Available':s?.payload?.state; state.textContent=summary||'Offline — no snapshot cached'; observed.textContent=s?.observed_at_unix_ms?`Observed ${new Date(s.observed_at_unix_ms).toISOString()}`:'Waiting for read-only Hub snapshot';};
try { const {invoke}=await import('@tauri-apps/api/core'); const {listen}=await import('@tauri-apps/api/event'); const {getCurrentWindow}=await import('@tauri-apps/api/window'); const current=getCurrentWindow(); window.addEventListener('keydown',e=>{if(e.key==='Escape')current.hide();}); await current.onFocusChanged(({payload})=>{if(payload)state.focus();}); try{render(await invoke('snapshot'));}catch{} startup.checked=await invoke('startup_setting').catch(()=>false); await listen('hub-snapshot-tick',async()=>{try{render(await invoke('snapshot'));}catch{}}); startup.addEventListener('change',()=>invoke('set_startup',{enabled:startup.checked})); } catch {}
</script>
