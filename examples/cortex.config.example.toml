# Cortex peer discovery config (D-14, SEAM D-S11) — vendor-neutral
# Copy to cortex.config.toml and edit. No hardcoded product name survives in code
# outside config defaults; discovery is env/config-driven.

[peers]
# peer = "/absolute/path/to/bin"
# Example:
# crypt = "/Users/you/bin/crypt"
# my-peer = "/usr/local/bin/my-peer"

# Env overrides (highest priority):
# CRYPT_BIN (legacy compat, still works)
# CORTEX_PEER_BIN_<NAME> e.g. CORTEX_PEER_BIN_CRYPT=/path/to/crypt
# CORTEX_PEER_BIN=/path/to/peer
