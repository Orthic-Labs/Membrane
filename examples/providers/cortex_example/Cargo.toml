[package]
name = "cortex_example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reference Cortex adapter built on membrane-provider-sdk. Mimics the shape of the real Cortex adapter (handles membrane_context and membrane_source_read) and is wired to the membrane-testkit golden fixtures so it can be exercised by the SDK's run_conformance harness."

[[bin]]
name = "cortex_example"
path = "src/main.rs"

[lib]
name = "cortex_example"
path = "src/lib.rs"

[dependencies]
membrane-provider-sdk = { workspace = true }
membrane-testkit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
