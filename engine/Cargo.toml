[workspace]
resolver = "2"
members = [
    "crates/cortex-core",
    "crates/cortex-format",
    "crates/cortex",
    "crates/cortex-store",
    "crates/membrane",
    "crates/membrane-runtime",
    "crates/membrane-protocol",
    "crates/membrane-core",
    "crates/membrane-mcp",
    "crates/membrane-provider-sdk",
    "crates/membrane-federation",
    "crates/membrane-testkit",
    "crates/membrane-updater",
    "crates/membrane-client",
    "crates/membrane-transcript",
    "crates/membrane-adapt",
]

[workspace.package]
edition = "2021"
authors = ["Cortex"]
# MBR-014: one controlling license for every crate — the proprietary Orthic Labs
# Source Use License in the repository-root LICENSE file (not an SPDX id, so it
# is named via license-file). Member crates inherit it via license-file.workspace.
license-file = "../LICENSE"

[workspace.dependencies]
serde       = { version = "1",  features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tiktoken-rs = "0.12"
hex         = "0.4"
sha2        = "0.11"
regex       = "1"
async-trait = "0.1"
tokio       = { version = "1", features = ["rt", "time", "macros"] }
tokio-util  = "0.7"
gix         = { version = "0.55", default-features = false }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = "symbols"

[profile.dev]
# line-tables-only: full debuginfo dominates large-crate dev codegen; backtraces keep file:line
debug = "line-tables-only"
