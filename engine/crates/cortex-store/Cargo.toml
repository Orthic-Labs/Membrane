[package]
name = "cortex-store"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "Cortex SQLite store, installation identity, scopes, and durable telemetry."

[dependencies]
membrane-protocol = { path = "../membrane-protocol" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
getrandom = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
