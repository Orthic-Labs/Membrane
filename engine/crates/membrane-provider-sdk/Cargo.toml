[package]
name = "membrane-provider-sdk"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "Membrane provider SDK. Exposes the typed Provider trait, the canonical Fixture shape, and the run_conformance harness so external adapters (Cortex, Crypt, custom) implement Membrane operations against the same contract the runtime and the MCP tool surface use."

[lib]
name = "membrane_provider_sdk"
path = "src/lib.rs"

[dependencies]
membrane-protocol = { path = "../membrane-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
membrane-testkit = { path = "../membrane-testkit" }
