[package]
name = "membrane"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "Native Membrane CLI and stdio MCP client for the Hub-owned in-process runtime."

[lib]
name = "membrane"
path = "src/lib.rs"

[[bin]]
name = "membrane"
path = "src/main.rs"

[[bin]]
name = "cli-parity"
path = "src/bin/cli-parity.rs"

[dependencies]
membrane-mcp = { path = "../membrane-mcp" }
membrane-runtime = { path = "../membrane-runtime" }
membrane-protocol = { path = "../membrane-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }

[build-dependencies]
serde_json = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
membrane-adapt = { path = "../membrane-adapt" }
membrane-transcript = { path = "../membrane-transcript" }
ring = "0.17"
