[package]
name = "membrane-runtime"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "Membrane federation, freshness, planning, and service runtime."

[[bin]]
name = "membrane-daemon"
path = "src/bin/membrane-daemon.rs"

[dependencies]
cortex-store = { path = "../cortex-store" }
cortex-core = { package = "cortex-core", path = "../cortex-core" }
cortex-format = { package = "cortex-format", path = "../cortex-format" }
membrane-protocol = { path = "../membrane-protocol" }
membrane-core = { path = "../membrane-core" }
membrane-mcp = { path = "../membrane-mcp" }
membrane-federation = { path = "../membrane-federation" }
membrane-provider-sdk = { path = "../membrane-provider-sdk" }
membrane-adapt = { path = "../membrane-adapt" }
membrane-transcript = { path = "../membrane-transcript" }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
tokio-util = { workspace = true }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["limit", "timeout"] }
getrandom = "0.4"
flate2 = "1"
sha2 = "0.11"
hex = { workspace = true }
comrak = "0.54"
ignore = "=0.4.33"
unicode-normalization = "0.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tokenizers = { version = "0.23", optional = true }
tempfile = "3"
[target."cfg(windows)".dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic", "directml", "ndarray"] }
[target."cfg(not(windows))".dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic", "ndarray"] }

[features]
default = ["llmlingua-onnx"]
fastembed = ["cortex-core/fastembed", "dep:ort"]
llmlingua-onnx = ["dep:tokenizers", "dep:ort"]

[build-dependencies]
serde_json.workspace = true
