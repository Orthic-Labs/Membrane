[package]
name = "membrane-runtime"
version = "0.1.0"
edition.workspace = true
description = "Membrane federation, freshness, planning, and service runtime."

[dependencies]
crypt-store = { path = "../crypt-store" }
memright-core = { package = "crypt-core", path = "../crypt-core" }
memright-format = { package = "crypt-format", path = "../crypt-format" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
getrandom = "0.2"
sha2 = "0.10"
comrak = "0.54"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.21"
tokenizers = { version = "0.15", optional = true }
[target."cfg(windows)".dependencies]
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic", "directml", "ndarray"] }
[target."cfg(not(windows))".dependencies]
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "api-24", "load-dynamic", "ndarray"] }

[features]
default = ["llmlingua-onnx"]
fastembed = ["memright-core/fastembed", "dep:ort"]
llmlingua-onnx = ["dep:tokenizers", "dep:ort"]

[dev-dependencies]
tempfile = "3"
