[package]
name = "crypt"
version = "0.1.1"
edition.workspace = true
license-file.workspace = true
description = "Crypt CLI and service for Membrane runtime."

[[bin]]
name = "crypt"
path = "src/main.rs"

[[bin]]
name = "crypt-service"
path = "src/crypt_service_main.rs"

[dependencies]
membrane-runtime = { path = "../membrane-runtime" }

[features]
default = ["membrane-runtime/llmlingua-onnx"]
fastembed = ["membrane-runtime/fastembed"]
llmlingua-onnx = ["membrane-runtime/llmlingua-onnx"]

[dev-dependencies]
crypt-core = { path = "../crypt-core" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"
