[package]
name = "membrane-supervisor"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "Per-user Membrane supervisor. Owns one resident process, publishes the supervisor endpoint that client adapters consume, and enforces single-instance invocation. Runs OUTSIDE the membrane binary so the resident child can be restarted without tearing the supervisor down."

[lib]
name = "membrane_supervisor"
path = "src/lib.rs"

[[bin]]
name = "membrane-supervisor"
path = "src/bin/membrane_supervisor.rs"

[dependencies]
membrane-protocol = { path = "../membrane-protocol" }
membrane-runtime = { path = "../membrane-runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
