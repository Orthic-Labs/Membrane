[package]
name = "memright"
version = "0.1.1"
edition.workspace = true
description = "MemRight compatibility CLI and service facade for Crypt plus Membrane runtime."

[[bin]]
name = "memright"
path = "src/main.rs"

[[bin]]
name = "memright-service"
path = "src/service_main.rs"

[dependencies]
membrane-runtime = { path = "../membrane-runtime" }

[features]
default = ["membrane-runtime/llmlingua-onnx"]
fastembed = ["membrane-runtime/fastembed"]
llmlingua-onnx = ["membrane-runtime/llmlingua-onnx"]

[dev-dependencies]
memright-core = { path = "../memright-core" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"
