[package]
name = "cortex"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
description = "Cortex durable-memory CLI for Membrane."

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
membrane-runtime = { path = "../membrane-runtime" }

[features]
default = ["membrane-runtime/llmlingua-onnx"]
fastembed = ["membrane-runtime/fastembed"]
llmlingua-onnx = ["membrane-runtime/llmlingua-onnx"]

[dev-dependencies]
cortex-core = { path = "../cortex-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
hex = { workspace = true }
tempfile = "3"
