name: package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  clean-tarball:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-package.mjs
