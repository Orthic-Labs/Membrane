# Build an installable Windows package with no certificate in the path.
#
# This is the development loop: change something, build, install it on a real
# desktop, find what is broken, fix it. Signing, notarization and publication
# are a separate concern and live in release-candidate.yml; nothing here can
# tag, publish, or touch a release channel.
name: unsigned-installer

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Commit to build (defaults to the branch head)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run outside the public repository
        run: |
          set -euo pipefail
          [[ "${{ github.repository }}" == "Orthic-Labs/Membrane" ]]

  installer:
    needs: [private-repo-guard]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            engine -> target
            apps/membrane-tray-windows -> target
            apps/membrane-hub/src-tauri -> target
          shared-key: membrane-rust
          add-job-id-key: false
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: false
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned installer
        run: pnpm --dir apps/membrane-hub run release:build:win:unsigned
        env:
          MEMBRANE_PUBLIC_CI_DIRECT_CARGO: "1"
      - name: Collect the installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned"
          found="$(find apps/membrane-hub/src-tauri/target -name 'Membrane_Hub_*_x64-setup.exe' -print -quit)"
          [[ -n "$found" ]]
          cp "$found" "$RUNNER_TEMP/unsigned/"
          ls -l "$RUNNER_TEMP/unsigned"
      - name: Upload the unsigned installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: membrane-unsigned-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unsigned/**
