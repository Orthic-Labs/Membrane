name: push-source-inspection
on:
  push:
    branches: [push-end-to-end]
    paths: [.github/workflows/push-source-inspection.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/push-end-to-end'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Snapshot tracked text only
        shell: python
        run: |
          import json, pathlib, subprocess, zipfile
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          suffixes = {'.rs','.toml','.lock','.json','.jsonl','.mjs','.cjs','.js','.ts','.md','.yaml','.yml','.py','.html','.txt','.sh','.ps1','.sql'}
          with zipfile.ZipFile('/tmp/push-tracked-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              archive.writestr('INSPECTION_REVISION', subprocess.check_output(['git','rev-parse','HEAD']))
              omitted = []
              for name in names:
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.is_symlink(): continue
                  if path.suffix not in suffixes or path.stat().st_size > 8*1024*1024:
                      omitted.append(name)
                      continue
                  archive.write(path, name)
              archive.writestr('INSPECTION_OMITTED.json', json.dumps(omitted))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: push-tracked-source
          path: /tmp/push-tracked-source.zip
          retention-days: 1
          if-no-files-found: error
