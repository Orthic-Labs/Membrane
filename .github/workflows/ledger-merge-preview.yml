name: ledger-merge-preview

on:
  push:
    branches: [ledger-end-to-end]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    if: github.ref == 'refs/heads/ledger-end-to-end'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Merge current main using reviewed two-file resolution
        run: |
          test -f scripts/ci/ledger-merge-main.py
          sed -i 's/4e563fc3f43ed3d05e7f04b7c655852478479fb3/50da1910022581fc31f8d555ed47c8d40b277546/' scripts/ci/ledger-merge-main.py
          python3 scripts/ci/ledger-merge-main.py
