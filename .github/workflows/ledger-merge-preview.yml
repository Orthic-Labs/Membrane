name: ledger-merge-preview

on:
  push:
    branches: [ledger-end-to-end]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    if: github.ref == 'refs/heads/ledger-end-to-end' && hashFiles('scripts/ci/ledger-merge-main.py') != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Merge current main using reviewed two-file resolution
        run: python3 scripts/ci/ledger-merge-main.py
