# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: publish-npm.yml | Template version: 1.0.0
# OIDC trusted publishing is the sole publish credential —
# no long-lived npm token, no signing material (invariant I2). Runs after
# right-release has already built/signed/notarized locally and attached
# artifacts to the GitHub Release (DESIGN.md §7); this job publishes the
# source npm package itself.
name: publish-npm
on:
  release:
    types: [published]
permissions:
  contents: read
# F5 fix: see ci.yml for why the guard is its own always-runs job rather
# than a job-level `if: !private` (which only skipped instead of failing).
jobs:
  private-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::right-git: repository is private; managed public-only workflows must not run here."
          exit 1
  publish-npm:
    needs: [private-repo-guard]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/build-candidate.mjs --version "${{ github.event.release.tag_name }}" --platform current --out "release/candidates/publish"
      - run: node scripts/release/check-release.mjs release/candidates/publish
      - id: tarball
        shell: bash
        run: |
          TARBALL="release/candidates/publish/$(node -e 'const c=require("./release/candidates/publish/compatibility.json");process.stdout.write(c.packageName.replace(/^@/, "").replace("/", "-")+"-"+c.version+".tgz")')"
          test -f "$TARBALL"
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
      - run: npm publish "${{ steps.tarball.outputs.path }}" --provenance --access public
