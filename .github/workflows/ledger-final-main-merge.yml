name: ledger-final-main-merge

on:
  push:
    branches: [ledger-end-to-end]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-current-main:
    if: github.ref == 'refs/heads/ledger-end-to-end'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Merge pinned current main and reconcile shared canon outputs
        run: |
          set -euo pipefail
          expected_main='b6c335c2643d165a4370f13e6369805fe3675e01'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$expected_main" || { echo "main moved: $observed_main"; exit 2; }

          preservation='docs/provenance/migrations/2026-08-30-atomic-canons/preservation-map.md'
          cp "$preservation" "$RUNNER_TEMP/ledger-preservation-before-merge.md"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && [ "$merge_status" -ne 1 ]; then
            exit "$merge_status"
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for path in "${conflicts[@]}"; do
            case "$path" in
              docs/canon/README.md|docs/pending/README.md)
                git checkout --ours -- "$path"
                git add -- "$path"
                ;;
              docs/provenance/migrations/2026-08-30-atomic-canons/preservation-map.md)
                git checkout --theirs -- "$path"
                git add -- "$path"
                ;;
              *)
                echo "unexpected merge conflict: $path"
                exit 3
                ;;
            esac
          done

          python3 - <<'PY'
          from pathlib import Path
          current = Path('docs/provenance/migrations/2026-08-30-atomic-canons/preservation-map.md')
          before = Path(__import__('os').environ['RUNNER_TEMP']) / 'ledger-preservation-before-merge.md'
          text = current.read_text(encoding='utf-8').rstrip() + '\n'
          old = before.read_text(encoding='utf-8').splitlines()
          for atom in ('LDG-029', 'LDG-030', 'LDG-031'):
              rows = [line for line in old if line.startswith(f'| {atom} |')]
              if len(rows) != 1:
                  raise SystemExit(f'expected one preserved row for {atom}, got {len(rows)}')
              if not any(line.startswith(f'| {atom} |') for line in text.splitlines()):
                  text += rows[0] + '\n'
          current.write_text(text, encoding='utf-8')
          PY
          git add -- "$preservation"

          node scripts/ci/check-atomic-canons.mjs --write
          git add -- docs/canon/README.md docs/pending/README.md "$preservation"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

          # Remove authoring-only transport and this one-shot merge workflow.
          git rm -f --ignore-unmatch \
            .github/workflows/ledger-final-main-merge.yml \
            scripts/ci/ledger-apply.py \
            scripts/ci/ledger-finish.patch.gz.b64 \
            scripts/ci/ledger-final-chunks/00 \
            scripts/ci/ledger-final-chunks/00a \
            scripts/ci/ledger-final-chunks/00b \
            scripts/ci/ledger-final-chunks/01 \
            scripts/ci/ledger-final-chunks/02 \
            scripts/ci/ledger-final-chunks/03 \
            scripts/ci/ledger-final-chunks/04 \
            scripts/ci/ledger-final-chunks/05 \
            scripts/ci/ledger-final-chunks/06 \
            scripts/ci/ledger-final-chunks/07 \
            scripts/ci/ledger-final-chunks/08

          git commit -m 'merge(ledger): integrate final Push canon reconciliation\n\nMerge current main after Ledger implementation, preserve both subsystems’ canon additions, regenerate shared indexes, and remove authoring-only patch transport. No build, test binary, package, activation, installation, or release performed.\n\n[skip ci]'
          git push origin HEAD:refs/heads/ledger-end-to-end
          git rev-parse HEAD
