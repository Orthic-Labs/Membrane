name: adapt-finalize-v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adapt-finalize-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13'
      - name: Archive completed Codex handoff outside frozen pending inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/provenance/foundation/2026-09-05-adapt-final
          git mv docs/pending/ADAPT-MEMBRANE-CODEX-HANDOFF-2026-09-05.md \
            docs/provenance/foundation/2026-09-05-adapt-final/ADAPT-MEMBRANE-CODEX-HANDOFF-2026-09-05.md
      - name: Reuse reconciler from first guarded attempt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('.github/workflows/adapt-finalize.yml', 'utf8').replace(/\r\n/g, '\n');
          const marker = "          node <<'NODE'\n";
          const start = source.indexOf(marker);
          if (start < 0) throw new Error('reconciler start marker missing');
          const bodyStart = start + marker.length;
          const end = source.indexOf('\n          NODE', bodyStart);
          if (end < 0) throw new Error('reconciler end marker missing');
          let body = source.slice(bodyStart, end).split('\n').map((line) => line.replace(/^          /, '')).join('\n');
          body = body.replace(
            "const handoffPath = 'docs/pending/ADAPT-MEMBRANE-CODEX-HANDOFF-2026-09-05.md';",
            "const handoffPath = 'docs/provenance/foundation/2026-09-05-adapt-final/ADAPT-MEMBRANE-CODEX-HANDOFF-2026-09-05.md';"
          );
          fs.writeFileSync('/tmp/adapt-finalize.js', body);
          NODE
          node /tmp/adapt-finalize.js
      - name: Regenerate atomic canon truth
        run: node scripts/ci/check-atomic-canons.mjs --write
      - name: Validate atomic canon truth
        run: node scripts/ci/check-atomic-canons.mjs
      - name: Validate Adapt ontology tests
        run: node --test scripts/ci/check-adapt-ontology.test.mjs
      - name: Validate Adapt ontology
        run: node scripts/ci/check-adapt-ontology.mjs
      - name: Validate patch whitespace
        run: git diff --check
      - name: Delete superseded Adapt branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            codex/adapt-close-remaining-20260905 \
            codex/adapt-governed-runtime-20260905 \
            codex/adapt-governed-runtime-integrated-20260905
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
      - name: Commit reconciled canon and archived handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/canon docs/pending \
            docs/provenance/foundation/2026-08-31-competitive-comparison/adapt.md \
            docs/provenance/foundation/2026-09-05-adapt-final
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "docs(adapt): reconcile merged implementation truth [skip ci]"
          git push origin HEAD:main
      - name: Verify obsolete Adapt branches are gone
        shell: bash
        run: |
          set -euo pipefail
          stale="$(git ls-remote --heads origin 'refs/heads/*adapt*' | awk '{print $2}' || true)"
          if [[ -n "$stale" ]]; then
            echo "Stale Adapt branches remain:"
            echo "$stale"
            exit 1
          fi
