# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/ci.yml | Template version: 1.1.0
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  private-repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  ci:
    needs: [private-repo-guard]
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        node: ["22.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - run: rustup toolchain install stable --profile minimal
      - name: DO NOT MERGE — Ledger rename scoped Cargo check
        working-directory: engine
        run: cargo check --locked -p membrane-runtime -p cortex -p membrane-protocol -p membrane
      - name: DO NOT MERGE — Ledger rename scoped Cargo tests
        working-directory: engine
        run: cargo test --locked -p membrane-runtime -p cortex -p membrane-protocol -p membrane
      - run: bash ./scripts/ci/run-ci.sh
