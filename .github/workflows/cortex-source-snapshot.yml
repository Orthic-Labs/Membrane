name: cortex-source-snapshot
on:
  push:
    branches: [cortex-governed-lifecycle]
    paths: [.github/workflows/cortex-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export current tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/membrane-source.tar.gz"
          sha256sum "$RUNNER_TEMP/membrane-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-source-tree
          path: ${{ runner.temp }}/membrane-source.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
# refreshed after governed lifecycle implementation
