name: cortex-source-snapshot
on:
  push:
    branches: [cortex-governed-lifecycle]
    paths: [.github/workflows/cortex-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source and commit history only
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/membrane.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/membrane.bundle"
          sha256sum "$RUNNER_TEMP/membrane.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-source-bundle
          path: ${{ runner.temp }}/membrane.bundle
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
