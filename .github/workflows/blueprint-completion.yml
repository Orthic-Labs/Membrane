name: blueprint-completion-checks

on:
  push:
    branches: [blueprint-completion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - name: Install JavaScript dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Temporary source and installed test-dependency snapshot
        id: snapshot
        continue-on-error: true
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/blueprint-source.tar" HEAD
          tar --format=posix --hard-dereference --create --file="$RUNNER_TEMP/blueprint-deps.tar" node_modules blueprint/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.snapshot.outcome == 'success'
        continue-on-error: true
        with:
          name: blueprint-check-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blueprint-source.tar
            ${{ runner.temp }}/blueprint-deps.tar
          retention-days: 1
          if-no-files-found: error
      - name: Blueprint focused Node tests
        working-directory: blueprint
        run: >-
          node --test
          tests/watchman-phase2-completion.test.mjs
          tests/watchman.test.mjs
          tests/incremental-phase2.test.mjs
          tests/semantic-incremental.test.mjs
          tests/freshness-barrier.test.mjs
          tests/relationship-vocabulary.test.mjs
          tests/relationship-parity.test.mjs
          tests/compiler-adapters.test.mjs
          tests/parse-cache-fingerprint.test.mjs
          tests/scip-normalizer.test.mjs
          tests/javascript-module-resolution.test.mjs
          tests/provenance-semantics.test.mjs
          tests/evidence-authority.test.mjs
          tests/evidence-authority-boundary.test.mjs
          tests/recall-circuit.test.mjs
          tests/semantic-conformance.test.mjs
          tests/publication-policy.test.mjs
          tests/readiness-status.test.mjs
          tests/init-plan.test.mjs
          tests/confidence-migration.test.mjs
          tests/provenance-roundtrip.test.mjs
          tests/store-sqlite.test.mjs
          tests/store-migrations.test.mjs
          tests/store-rollback.test.mjs
          tests/delta-store.test.mjs
          tests/production-provider-cluster.test.mjs
          tests/graph-query.test.mjs
      - name: Full Blueprint Node corpus
        working-directory: blueprint
        run: node scripts/test-random.mjs --ordered --batch-size=32

  cargo-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      - name: Cargo compile check only
        run: cargo check --manifest-path engine/Cargo.toml --workspace --locked
