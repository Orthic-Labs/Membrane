name: cortex-governed-lifecycle-checks
on:
  push:
    branches: [cortex-governed-lifecycle]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cortex-governed-lifecycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply-and-check:
    if: github.ref == 'refs/heads/cortex-governed-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: cortex-governed-lifecycle
      - name: Apply sealed reviewed source changes to this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = cortex-governed-lifecycle
          if test -d .cortex-transfer; then
            git merge-base --is-ancestor ad3d719904a2f314f6901ea7367fee6e69c0338d HEAD
            python3 - <<'PY'
          import hashlib, lzma, os, pathlib
          pieces = sorted(pathlib.Path('.cortex-transfer').glob('part-*.xzpart'))
          assert len(pieces) == 6, 'incomplete transfer'
          patch = lzma.decompress(b''.join(p.read_bytes() for p in pieces))
          assert len(patch) == 196168
          assert hashlib.sha256(patch).hexdigest() == 'ed73109a4387a15ab43661f4bc3941ae847bcfd34235b28e4323df6a95e7e570'
          assert b'diff --git a/.github/' not in patch, 'source patch cannot change workflows'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'cortex.patch').write_bytes(patch)
          PY
            git apply --check --index "$RUNNER_TEMP/cortex.patch"
            git apply --index "$RUNNER_TEMP/cortex.patch"
            git rm -r .cortex-transfer
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(cortex): signed review, recoverable admission and native memory lifecycle'
            git push origin HEAD:refs/heads/cortex-governed-lifecycle
          fi
          echo "TESTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H %s'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Protocol and offline reviewer-signing tests
        run: node --test engine/crates/membrane-protocol/bindings/operations.test.mjs scripts/tools/cortex/sign-reviewed-effect.test.mjs
      - name: Generated product truth consistency
        run: node scripts/tools/productization/generate-product-truth.mjs --check
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          toolchain: stable
          components: rustfmt
      - name: Check native workspace compilation
        run: cargo check --manifest-path engine/Cargo.toml --workspace --locked
      - name: Native MCP contract and discovery tests
        if: success() || failure()
        run: cargo test --manifest-path engine/Cargo.toml -p membrane-mcp --locked
      - name: Native protocol contract tests
        if: success() || failure()
        run: cargo test --manifest-path engine/Cargo.toml -p membrane-protocol --test operations_roundtrip --locked
      - name: Cortex lifecycle owner tests
        if: success() || failure()
        run: cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --no-default-features --lib cortex_lifecycle::tests --locked
      - name: Native authorization integration tests
        if: success() || failure()
        run: cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --no-default-features --test native_authorization --locked
      - name: Record exact tested revision
        if: always()
        run: echo "Cortex checked revision $TESTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
