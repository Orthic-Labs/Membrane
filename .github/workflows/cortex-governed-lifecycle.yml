name: cortex-governed-lifecycle-checks
on:
  push:
    branches: [cortex-governed-lifecycle]
permissions:
  contents: write
concurrency:
  group: cortex-governed-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.24.0
      - name: Prepare generated references
        run: node engine/crates/membrane/scripts/generate-cli-subcommands.mjs --write
      - name: Install JS dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/check-atomic-canons.mjs --write
          node scripts/ci/check-atomic-canons.mjs
          node engine/crates/membrane/scripts/generate-cli-subcommands.mjs --check
          node scripts/ci/check-generated.mjs
          node scripts/ci/check-protocol-generation.mjs
          node --test scripts/ci/check-atomic-canons.test.mjs
          node --test tests/contracts/native-mcp-contract.test.mjs tests/mcp-native-execution.test.mjs tests/cli/native-dispatch.test.mjs tests/cli/cli-surface.test.mjs
      - name: Cargo compile check
        run: cargo check --manifest-path engine/Cargo.toml --workspace --locked
      - name: Cortex focused Rust suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib cortex_lifecycle
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib feedback
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib checkpoint
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib vector_index
          cargo test --manifest-path engine/Cargo.toml -p membrane-mcp
      - name: Commit verified generated references
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cortex): refresh generated references"
          git push origin HEAD:cortex-governed-lifecycle
