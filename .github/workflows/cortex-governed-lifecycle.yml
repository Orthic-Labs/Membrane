name: cortex-governed-lifecycle-checks
on:
  push:
    branches: [cortex-governed-lifecycle]
permissions:
  contents: write
concurrency:
  group: cortex-governed-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fix restart-stable review binding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/crates/membrane-runtime/src/cortex_lifecycle.rs')
          text=p.read_text()
          old=' || trust.installation_id != store.installation_id()\n'
          if old not in text: raise SystemExit('review binding pattern not found')
          p.write_text(text.replace(old, '\n', 1))
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.24.0
      - name: Prepare generated and evidence references
        shell: bash
        run: |
          set -euo pipefail
          node engine/crates/membrane/scripts/generate-cli-subcommands.mjs --write
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'engine/crates/membrane-runtime/src/mcp_executor.rs:1463-1493':'engine/crates/membrane-runtime/src/mcp_executor.rs:1179-1232',
            'engine/crates/membrane-runtime/src/mcp_executor.rs:1495-1515':'engine/crates/membrane-runtime/src/mcp_executor.rs:1233-1254',
            'engine/crates/membrane-runtime/src/mcp_executor.rs:1534-1577':'engine/crates/membrane-runtime/src/mcp_executor.rs:1271-1360',
          }
          for name in ['docs/canon/membrane.md','docs/provenance/migrations/2026-08-30-atomic-canons/source-consumer-reconciliation.md']:
              p=Path(name); text=p.read_text()
              for old,new in replacements.items(): text=text.replace(old,new)
              p.write_text(text)
          PY
          old_hash=efb0eb1bc08b3f0e11e74a2a44fb3db17d4a9e08
          receipt=docs/provenance/migrations/2026-08-30-atomic-canons/source-consumer-reconciliation.md
          new_hash=$(git hash-object "$receipt")
          grep -rl "@$old_hash" docs/canon --include='*.md' | xargs -r sed -i "s/@$old_hash/@$new_hash/g"
      - name: Install JS dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/check-atomic-canons.mjs --write
          node scripts/ci/check-atomic-canons.mjs
          node engine/crates/membrane/scripts/generate-cli-subcommands.mjs --check
          node scripts/ci/check-generated.mjs
          node --test scripts/ci/check-atomic-canons.test.mjs
      - name: Cargo compile check
        run: cargo check --manifest-path engine/Cargo.toml --workspace --locked
      - name: Cortex focused Rust suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib cortex_lifecycle
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib feedback
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib checkpoint
          cargo test --manifest-path engine/Cargo.toml -p membrane-runtime --lib vector_index
          cargo test --manifest-path engine/Cargo.toml -p membrane-mcp
      - name: Commit verified implementation and generated references
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cortex): preserve reviewed effects across restart"
          git push origin HEAD:cortex-governed-lifecycle
