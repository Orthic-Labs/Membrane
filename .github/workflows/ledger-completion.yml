name: ledger-completion-checks

on:
  push:
    branches: [ledger-end-to-end]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ledger-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/ledger-end-to-end' && !contains(github.event.head_commit.message, '[ledger-setup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve reviewed dependency lock changes without compilation
        if: hashFiles('scripts/ci/ledger-lock-refresh') != ''
        run: |
          cargo metadata --manifest-path engine/Cargo.toml --format-version 1 > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/Cargo.lock
          git rm scripts/ci/ledger-lock-refresh
          git commit -m 'chore(ledger): resolve explicit dependency additions [skip ci]'
          git push origin HEAD:refs/heads/ledger-end-to-end
      - name: Decode reviewed Ledger patch
        if: hashFiles('scripts/ci/ledger-finish.patch.gz.b64') != ''
        run: base64 --decode scripts/ci/ledger-finish.patch.gz.b64 | gzip --decompress > scripts/ci/ledger-finish.patch
      - name: Materialize reviewed edits, without force-pushing
        if: hashFiles('scripts/ci/ledger-edits.json') != ''
        run: python3 scripts/ci/ledger-apply.py
      - name: Record exact checked revision
        run: |
          git rev-parse HEAD
          git diff --check
      - name: Export public source snapshot for branch review
        run: |
          git rev-parse HEAD > ledger-source-revision.txt
          git archive --format=tar.gz --output=ledger-source.tar.gz HEAD engine/crates engine/Cargo.toml engine/Cargo.lock mcp schemas scripts docs tests package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows .rightgit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledger-source-review
          path: |
            ledger-source.tar.gz
            ledger-source-revision.txt
          retention-days: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.24.0
      - name: Install JavaScript dependencies without build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Ledger source and schema checks
        run: |
          if test -f tests/ledger-wiring-contracts.test.mjs; then
            node --test tests/ledger-wiring-contracts.test.mjs
          fi
          node scripts/ci/check-atomic-canons.mjs
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine -> target
          shared-key: membrane-ledger-check
          cache-on-failure: true
      - name: Type-check workspace and test sources only
        run: cargo check --manifest-path engine/Cargo.toml --workspace --tests --locked
