name: ledger-completion-checks

on:
  push:
    branches: [ledger-end-to-end]
  workflow_dispatch:

# Branch-only check lane. The managed main/release workflows are unchanged.
# No cargo build, cargo test, packaging, signing, installation or activation.
permissions:
  contents: read

concurrency:
  group: ledger-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/ledger-end-to-end' && !contains(github.event.head_commit.message, '[ledger-setup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Only the reviewed, hash-guarded edit batch may fast-forward this branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Materialize reviewed edits, without force-pushing
        if: hashFiles('scripts/ci/ledger-edits.json') != ''
        run: python3 scripts/ci/ledger-apply.py
      - name: Record exact checked revision
        run: |
          git rev-parse HEAD
          git diff --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - name: Install JavaScript dependencies without build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Ledger source and schema checks
        run: |
          if test -f tests/ledger-wiring-contracts.test.mjs; then
            node --test tests/ledger-wiring-contracts.test.mjs
          fi
          node scripts/ci/check-atomic-canons.mjs
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine -> target
          shared-key: membrane-ledger-check
          cache-on-failure: true
      - name: Type-check workspace and test sources only
        run: cargo check --manifest-path engine/Cargo.toml --workspace --tests --locked
