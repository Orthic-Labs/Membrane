[package]
name = "crypt_example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reference Crypt adapter built on membrane-provider-sdk. Mimics the shape of the real Crypt adapter (handles membrane_knowledge_propose and membrane_checkpoint_save) and is wired to the membrane-testkit golden fixtures so it can be exercised by the SDK's run_conformance harness."

[[bin]]
name = "crypt_example"
path = "src/main.rs"

[lib]
name = "crypt_example"
path = "src/lib.rs"

[dependencies]
membrane-provider-sdk = { workspace = true }
membrane-testkit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
