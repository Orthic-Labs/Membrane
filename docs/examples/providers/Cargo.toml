[workspace]
resolver = "2"
members = [
    "blueprint_example",
    "cortex_example",
]

[workspace.package]
edition = "2021"
authors = ["Membrane"]
license = "Proprietary"

[workspace.dependencies]
membrane-provider-sdk = { path = "../../engine/crates/membrane-provider-sdk" }
membrane-testkit = { path = "../../engine/crates/membrane-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
