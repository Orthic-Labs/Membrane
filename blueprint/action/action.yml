name: Blueprint Architecture Rules
description: Run Blueprint rules on the changed slice and upload SARIF.
inputs:
  version:
    description: 'Immutable Blueprint release version (e.g. v0.2.0)'
    required: true
    default: 'v0.2.0'
  rules-path:
    description: 'Path to blueprint.rules.yml'
    required: false
    default: 'blueprint.rules.yml'
runs:
  using: 'node20'
  main: 'index.mjs'
