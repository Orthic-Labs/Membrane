# Blueprint peer discovery config (D-14, SEAM D-S11) — vendor-neutral
# Copy to blueprint.config.toml and edit. No hardcoded product name survives in code
# outside config defaults; discovery is env/config-driven.

[peers]
# peer = "/absolute/path/to/bin"
# Example:
# cortex = "/Users/you/bin/cortex"
# my-peer = "/usr/local/bin/my-peer"

# Env overrides (highest priority):
# CORTEX_BIN for the canonical Cortex durable-knowledge peer
# BLUEPRINT_PEER_BIN_<NAME> e.g. BLUEPRINT_PEER_BIN_CORTEX=/path/to/cortex
# BLUEPRINT_PEER_BIN=/path/to/peer
