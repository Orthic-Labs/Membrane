name: package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  clean-tarball:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-package.mjs
