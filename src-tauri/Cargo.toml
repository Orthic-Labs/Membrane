[package]
name = "membrane-hub"
version = "0.1.1"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
[dev-dependencies]
tempfile = "3"
[build-dependencies]
tauri-build = { version = "2", features = [] }
