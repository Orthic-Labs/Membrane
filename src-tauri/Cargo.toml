[package]
name = "membrane-hub"
version = "0.1.5"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"
# MBR-911: pure dual-signature update-admission contract (engine/crates/membrane-updater).
# Path dependency into the engine workspace's member crate, reused as-is; no new
# external crate and no cryptography added here or in that crate.
membrane-updater = { path = "../../../engine/crates/membrane-updater" }
[dev-dependencies]
tempfile = "3"
[build-dependencies]
tauri-build = { version = "2", features = [] }
