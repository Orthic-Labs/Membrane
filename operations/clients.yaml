# MBR-206 — Canonical Membrane client registry.
#
# This file is the SINGLE SOURCE OF TRUTH for which AI/MCP clients the
# Membrane runtime knows how to enroll, and which subset of operations
# each client can honestly support. Every entry below is consumed by:
#
#   - scripts/tools/productization/generate-client-matrix.mjs (builds the
#     machine-readable client × operation matrix).
#   - mcp/install.mjs (decides which clients a clean install can
#     reasonably enroll against the current transport shape).
#   - docs/clients/README.md (explains the registry to operators).
#
# Cross-reference contract: each `supported_operations` entry MUST name
# an operation that exists in
# `operations/operations/operations-index.v1.golden.json` (the MBR-301
# index). The matrix generator enforces this contract; broken links
# fail the MBR-206 acceptance gate.
#
# To add a new client:
#   1. Append one entry below. Every required key is mandatory.
#   2. List only operations the client can honor end-to-end; partial
#      support is not honest — use `degraded_operations` instead and
#      keep `supported_operations` to the operations that work fully.
#   3. Set `authority_grant` to the largest scope the client can
#      safely accept. The install path refuses to grant a wider scope.
#   4. Re-run `node scripts/tools/productization/generate-client-matrix.mjs`.
#      The generated `docs/clients/support-matrix.v1.json` and the
#      `operations/clients.capabilities.v1.json` artifact are
#      regenerated byte-stably from this file plus the operation
#      index.

schema: orthic.client-registry.v1
schema_version: 1
generated_from:
  - operations/operations/operations-index.v1.golden.json

clients:

  - id: claude
    display_name: "Claude Code"
    transport: stdio
    discovery_method: "native-mcp-cli"
    binary_env: MEMBRANE_CLAUDE_BIN
    install_command: "mcp add --scope <local|project|user> membrane -- <node> <server>"
    detect_command: "--version"
    get_command: "mcp get membrane"
    remove_command: "mcp remove membrane"
    add_command: "mcp add --scope <local|project|user> membrane -- <node> <server>"
    scope_default: local
    authority_grant:
      max_level: L4
      scopes: [read-only, workspace-read]
      loopback_only: true
    honest_level: L4
    supported_operations:
      - membrane_context
      - membrane_source_read
      - membrane_knowledge_propose
      - membrane_checkpoint_save
      - membrane_checkpoint_load
      - membrane_working_context
      - membrane_temporal_fact
      - membrane_scratchpad
      - membrane_feedback
    degraded_operations: []

  - id: codex
    display_name: "Codex CLI"
    transport: stdio
    discovery_method: "native-mcp-cli"
    binary_env: MEMBRANE_CODEX_BIN
    install_command: "mcp add membrane -- <node> <server>"
    detect_command: "--version"
    get_command: "mcp get membrane"
    remove_command: "mcp remove membrane"
    add_command: "mcp add membrane -- <node> <server>"
    scope_default: project
    authority_grant:
      max_level: L2
      scopes: [read-only]
      loopback_only: true
    honest_level: L2
    supported_operations:
      - membrane_context
      - membrane_source_read
      - membrane_knowledge_propose
      - membrane_checkpoint_save
      - membrane_checkpoint_load
      - membrane_working_context
      - membrane_temporal_fact
      - membrane_scratchpad
      - membrane_feedback
    degraded_operations: []

  - id: cursor
    display_name: "Cursor"
    transport: stdio
    discovery_method: "rules-file-and-mcp"
    binary_env: MEMBRANE_CURSOR_BIN
    install_command: "mcp add membrane -- <node> <server>"
    detect_command: "--version"
    get_command: "mcp get membrane"
    remove_command: "mcp remove membrane"
    add_command: "mcp add membrane -- <node> <server>"
    scope_default: project
    authority_grant:
      max_level: L1
      scopes: [read-only]
      loopback_only: true
    honest_level: L1
    supported_operations:
      - membrane_context
      - membrane_working_context
    degraded_operations:
      - membrane_source_read
      - membrane_knowledge_propose
      - membrane_checkpoint_save
      - membrane_checkpoint_load
      - membrane_temporal_fact
      - membrane_scratchpad
      - membrane_feedback

  - id: windsurf
    display_name: "Windsurf"
    transport: stdio
    discovery_method: "rules-file-and-mcp"
    binary_env: MEMBRANE_WINDSURF_BIN
    install_command: "mcp add membrane -- <node> <server>"
    detect_command: "--version"
    get_command: "mcp get membrane"
    remove_command: "mcp remove membrane"
    add_command: "mcp add membrane -- <node> <server>"
    scope_default: project
    authority_grant:
      max_level: L1
      scopes: [read-only]
      loopback_only: true
    honest_level: L1
    supported_operations:
      - membrane_context
      - membrane_working_context
    degraded_operations:
      - membrane_source_read
      - membrane_knowledge_propose
      - membrane_checkpoint_save
      - membrane_checkpoint_load
      - membrane_temporal_fact
      - membrane_scratchpad
      - membrane_feedback

  - id: generic_mcp
    display_name: "Generic MCP client"
    transport: stdio
    discovery_method: "mcp-stdio-only"
    binary_env: MEMBRANE_GENERIC_MCP_BIN
    install_command: "stdio-launch <node> <server>"
    detect_command: "--version"
    get_command: null
    remove_command: null
    add_command: "stdio-launch <node> <server>"
    scope_default: local
    authority_grant:
      max_level: L0
      scopes: [read-only]
      loopback_only: false
    honest_level: L0
    supported_operations:
      - membrane_context
    degraded_operations:
      - membrane_source_read
      - membrane_knowledge_propose
      - membrane_checkpoint_save
      - membrane_checkpoint_load
      - membrane_working_context
      - membrane_temporal_fact
      - membrane_scratchpad
      - membrane_feedback