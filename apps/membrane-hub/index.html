<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Membrane Hub</title><link rel="stylesheet" href="./src/overview.css"><main id="app" tabindex="0" aria-live="polite"><div id="snapshot"><section class="error-state" role="status"><h2>Offline — no snapshot cached</h2><p>Waiting for Hub-owned Membrane service</p></section></div><section class="startup-control" aria-label="Startup"><label><input id="launch-at-login" type="checkbox"> Launch Membrane Hub at login</label><output id="startup-status" aria-live="polite"></output></section></main><script type="module">
import { renderOverview } from './src/overview.mjs';
const app = document.querySelector('#app'); const snapshot = document.querySelector('#snapshot'); const startup = document.querySelector('#launch-at-login'); const startupStatus = document.querySelector('#startup-status');
const message=error=>error?.message||String(error||'Hub controls unavailable');
let invoke;
try { ({invoke}=await import('./vendor/@tauri-apps/api/core.js')); } catch(error) { startup.disabled=true; startupStatus.value=message(error); }
async function refresh(){if(!invoke)return;const [runtime,snapshotResult]=await Promise.allSettled([invoke('diagnostics_report'),invoke('snapshot')]);const runtimeValue=runtime.status==='fulfilled'?runtime.value:null;if(snapshotResult.status==='fulfilled'){renderOverview(snapshotResult.value,snapshot,runtimeValue);}else{renderOverview({result:{kind:'error',code:'snapshot_unavailable',message:message(snapshotResult.reason)}},snapshot,runtimeValue);}}
if(invoke){
  await refresh();
  try { startup.checked=await invoke('startup_setting'); startup.addEventListener('change',async()=>{startup.disabled=true; startupStatus.value='Saving…'; try{await invoke('set_startup',{enabled:startup.checked}); startupStatus.value=startup.checked?'Hub will launch at login':'Hub will not launch at login';}catch(error){startup.checked=!startup.checked; startupStatus.value=message(error);}finally{startup.disabled=false;}}); } catch(error) { startup.disabled=true; startupStatus.value=message(error); }
  try { const [{listen},{getCurrentWindow}]=await Promise.all([import('./vendor/@tauri-apps/api/event.js'),import('./vendor/@tauri-apps/api/window.js')]); const current=getCurrentWindow(); window.addEventListener('keydown',e=>{if(e.key==='Escape')current.hide();}); await current.onFocusChanged(({payload})=>{if(payload)app.focus();}); await listen('hub-snapshot-tick',refresh); } catch(error) { startupStatus.value ||= message(error); }
}
</script>
