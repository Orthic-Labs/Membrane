[package]
name = "membrane-hub"
version = "0.1.5"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"
[dev-dependencies]
tempfile = "3"
[build-dependencies]
tauri-build = { version = "2", features = [] }
