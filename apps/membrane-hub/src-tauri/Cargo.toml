[package]
name = "membrane-hub"
version = "0.1.23"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
membrane-updater = { path = "../../../engine/crates/membrane-updater" }
membrane-protocol = { path = "../../../engine/crates/membrane-protocol" }
[dev-dependencies]
tempfile = "3"
[build-dependencies]
tauri-build = { version = "2", features = [] }
