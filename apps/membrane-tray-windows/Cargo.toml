[package]
name = "membrane-tray-windows"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
membrane-protocol = { path = "../../engine/crates/membrane-protocol" }
slint = { version = "1.17.1", features = ["raw-window-handle-06"] }
tray-icon = "0.21.1"
getrandom = "0.4.3"
raw-window-handle = "0.6.2"
serde_json = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17.1"
